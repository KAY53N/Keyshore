<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keyshore</title>
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="app">
    <header class="top">
        <div class="identity">
            <div class="identicon" aria-hidden="true"></div>
            <div class="identity-text">
                <button class="addr" id="addrBtn" type="button" title="切换钱包">
                    0x9cb0...f40b
                    <span class="chevron">▾</span>
                </button>
                <p class="wallet-meta">私钥钱包 · KAY53N-OKX-001</p>
            </div>
        </div>
        <div class="top-actions">
            <button class="icon-btn" id="copyBtn" type="button" title="复制地址">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="9" y="9" width="11" height="13" rx="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
            </button>
            <button class="icon-btn" id="qrBtn" type="button" title="收款码">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="3" y="3" width="7" height="7" rx="1.2"/>
                    <rect x="14" y="3" width="7" height="7" rx="1.2"/>
                    <rect x="3" y="14" width="7" height="7" rx="1.2"/>
                    <path d="M14 14h3v3h-3zM20 14v6M14 20h3"/>
                </svg>
            </button>
            <button class="icon-btn" id="webBtn" type="button" title="浏览器">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M3 12h18M12 3c2.5 3 3.8 6 3.8 9S14.5 18 12 21c-2.5-3-3.8-6-3.8-9S9.5 6 12 3z"/>
                </svg>
            </button>
        </div>
    </header>

    <section class="balance">
        <h1>$22.30</h1>
        <div class="pnl">
            <span class="up">+$0.70 (+3.28%)</span>
            <button class="range" id="rangeBtn" type="button">1日 <span class="chevron">▾</span></button>
        </div>
    </section>

    <nav class="actions" aria-label="快捷操作">
        <button type="button" data-action="send">
        <span class="fab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 19V5M6 11l6-6 6 6"/>
          </svg>
        </span>
            发送
        </button>
        <button type="button" data-action="receive">
        <span class="fab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 5v14M6 13l6 6 6-6"/>
          </svg>
        </span>
            接收
        </button>
        <button type="button" data-action="swap">
        <span class="fab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M7 7h11l-3-3M17 17H6l3 3"/>
          </svg>
        </span>
            兑换
        </button>
        <button type="button" data-action="history">
        <span class="fab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="8"/>
            <path d="M12 8v5l3 2"/>
          </svg>
        </span>
            交易历史
        </button>
        <button type="button" data-action="more">
        <span class="fab">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <rect x="4" y="4" width="6" height="6" rx="1.4"/>
            <rect x="14" y="4" width="6" height="6" rx="1.4"/>
            <rect x="4" y="14" width="6" height="6" rx="1.4"/>
            <rect x="14" y="14" width="6" height="6" rx="1.4"/>
          </svg>
        </span>
            更多
        </button>
    </nav>

    <div class="tabs" role="tablist">
        <button class="is-active" role="tab" data-tab="tokens">币种</button>
        <button role="tab" data-tab="stocks">股票</button>
        <button role="tab" data-tab="defi">DeFi</button>
        <button role="tab" data-tab="dapp">DApp</button>
        <button role="tab" data-tab="nft">NFT</button>
        <button role="tab" data-tab="approvals">授权</button>
    </div>

    <section class="panel is-active" id="panel-tokens">
        <article class="asset">
            <div class="coin usdc">$</div>
            <div class="asset-main">
                <div class="asset-name">
                    USDC
                    <span class="apy">年化可达 4.07%</span>
                </div>
                <div class="asset-qty">8.07</div>
            </div>
            <div class="asset-right">
                <strong>$8.07</strong>
            </div>
        </article>

        <article class="asset">
            <div class="coin okb">
                <span></span>
            </div>
            <div class="asset-main">
                <div class="asset-name">OKB</div>
                <div class="asset-qty">0.047461</div>
            </div>
            <div class="asset-right">
                <strong>$5.46</strong>
                <small class="up">$115.25 (+3.71%)</small>
            </div>
        </article>

        <article class="asset">
            <div class="coin eth">
                <svg viewBox="0 0 24 24">
                    <path fill="#627EEA" d="M12 2l7 10-7 4-7-4 7-10z"/>
                    <path fill="#8A9FF0" d="M12 16l7-4-7 10-7-10 7 4z"/>
                </svg>
            </div>
            <div class="asset-main">
                <div class="asset-name">
                    ETH
                    <span class="apy">年化可达 3.43%</span>
                </div>
                <div class="asset-qty">0.001138</div>
            </div>
            <div class="asset-right">
                <strong>$2.79</strong>
                <small class="up">$2,456.77 (+0.65%)</small>
            </div>
        </article>

        <article class="asset">
            <div class="coin usdt">₮</div>
            <div class="asset-main">
                <div class="asset-name">
                    USDT
                    <span class="apy">年化可达 5.61%</span>
                </div>
                <div class="asset-qty">0.5</div>
            </div>
            <div class="asset-right">
                <strong>$0.49</strong>
            </div>
        </article>
    </section>

    <section class="panel empty" id="panel-stocks">暂无股票资产</section>
    <section class="panel empty" id="panel-defi">暂无 DeFi 仓位</section>
    <section class="panel empty" id="panel-dapp">暂无 DApp 连接</section>
    <section class="panel empty" id="panel-nft">暂无 NFT</section>
    <section class="panel empty" id="panel-approvals">暂无授权记录</section>
</div>

<div class="toast" id="toast" hidden></div>
<script src="popup.js"></script>
</body>
</html>
